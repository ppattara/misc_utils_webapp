<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    /* ============================================================
       Shared styles
       ============================================================ */
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1d2330;
      --muted: #5f6b7a;
      --border: #dde1e7;
      --accent: #2f6fde;
      --accent-text: #ffffff;
      --radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --surface: #1d2128;
        --text: #e6e9ee;
        --muted: #9aa4b2;
        --border: #2e343d;
        --accent: #5b8ef0;
        --accent-text: #0d1117;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 0;
    }

    .tabs a {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }

    .tabs a:hover { border-color: var(--accent); }

    .tabs a[aria-current="page"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    main.container {
      padding-top: 24px;
      padding-bottom: 48px;
    }

    .page {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .page:not(.is-active) { display: none !important; }

    .page > h1 {
      margin: 0 0 20px;
      font-size: 1.5rem;
    }

    .placeholder { color: var(--muted); }

    /* ============================================================
       Page-specific styles
       Scope every rule under its page's id, e.g. #work-timer .wt-time { ... }
       ============================================================ */

    /* ---------- Work Timer (#work-timer) ---------- */
    /* Each timer has its own color, blue for Work and green for Rest, in three shades: the solid
       color, a lighter shade (pale) for the ring's track, and a very soft shade (soft) for the card
       behind the timer. --wt-color, --wt-color-pale and --wt-color-soft are the shades of the timer on
       show: Work by default, Rest while the card (the page, or the floating window) has the class
       is-rest. Each Work/Rest tab keeps its own timer's color, for its running dot.
       A short break during work has its own, brighter green. While the card has the class is-break,
       it fills with that green (fill), and the ring's arc and the time take a deep green (ink) over a
       pale track. In dark mode the fill is a deep green, the ink a very light one and the track dim. */
    #work-timer {
      position: relative;
      --wt-work: #2f6fde;
      --wt-work-pale: #c1d4f5;
      --wt-work-soft: #eef3fc;
      --wt-rest: #318454;
      --wt-rest-pale: #c1dacc;
      --wt-rest-soft: #ecf6ef;
      --wt-break-fill: #87d576;
      --wt-break-track: #d5f2cf;
      --wt-break-ink: #26511c;
      --wt-color: var(--wt-work);
      --wt-color-pale: var(--wt-work-pale);
      --wt-color-soft: var(--wt-work-soft);
      background: var(--wt-color-soft);
    }
    @media (prefers-color-scheme: dark) {
      #work-timer {
        --wt-work: #5b8ef0;
        --wt-work-pale: #2e4266;
        --wt-work-soft: #222a38;
        --wt-rest: #53ae77;
        --wt-rest-pale: #2f4a38;
        --wt-rest-soft: #1f2e24;
        --wt-break-fill: #316a23;
        --wt-break-track: #22441a;
        --wt-break-ink: #d3f2cd;
      }
    }
    #work-timer.is-rest {
      --wt-color: var(--wt-rest);
      --wt-color-pale: var(--wt-rest-pale);
      --wt-color-soft: var(--wt-rest-soft);
    }
    #work-timer.is-break {
      --wt-color: var(--wt-break-ink);
      --wt-color-pale: var(--wt-break-track);
      --wt-color-soft: var(--wt-break-fill);
    }
    #work-timer #wt-tab-work { --wt-color: var(--wt-work); }
    #work-timer #wt-tab-rest { --wt-color: var(--wt-rest); }
    #work-timer [hidden] { display: none !important; }
    #work-timer button { font: inherit; color: inherit; }
    #work-timer button:not(:disabled) { cursor: pointer; }
    #work-timer :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Round icon buttons: the floating window button, the settings gear and the sidebar's close
       button. */
    #work-timer .wt-icon-btn {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
    }
    #work-timer .wt-icon-btn:hover { border-color: var(--accent); }
    #work-timer .wt-gear { position: absolute; top: 20px; right: 20px; }
    #work-timer .wt-float { position: absolute; top: 20px; right: 64px; }
    #work-timer .wt-gear[aria-expanded="true"],
    #work-timer .wt-float[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }

    #work-timer .wt-body { display: grid; gap: 20px; align-items: start; }

    /* Timer column */
    #work-timer .wt-main {
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    #work-timer .wt-tabs {
      display: flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
    }
    #work-timer .wt-tabs button {
      position: relative;
      min-width: 92px;
      padding: 6px 20px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: none;
      color: var(--muted);
    }
    #work-timer .wt-tabs button:hover { color: var(--text); }
    #work-timer .wt-tabs button[aria-selected="true"] {
      border-color: var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
    }
    /* Dot on the tab whose timer is counting down, in that timer's color. */
    #work-timer .wt-tabs button.is-running::after {
      content: "";
      position: absolute;
      top: calc(50% - 3px);
      right: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--wt-color);
    }
    #work-timer .wt-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    /* The ring: a pale circle (the track) with a solid arc for the share of the session left, both in
       the timer's color, or grey while paused. The time and the timer's name sit in the middle, sized
       from the ring (a size container), so they scale with it. */
    #work-timer .wt-ring {
      container-type: size;
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      place-items: center;
      width: min(300px, 100cqi);
      height: min(300px, 100cqi);
    }
    #work-timer .wt-ring > * { grid-area: 1 / 1; }
    #work-timer .wt-ring-svg { width: 100%; height: 100%; overflow: visible; }
    #work-timer .wt-ring-track,
    #work-timer .wt-ring-arc { fill: none; stroke-width: 6; }
    #work-timer .wt-ring-track { stroke: var(--wt-color-pale); }
    #work-timer .wt-ring-arc { stroke: var(--wt-color); }
    #work-timer .wt-ring-text { display: flex; flex-direction: column; align-items: center; }
    #work-timer .wt-time {
      font-size: 22cqmin;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    #work-timer .wt-ring-label { color: var(--muted); font-size: max(11px, 7cqmin); line-height: 1.3; }
    #work-timer .wt-ring.is-running .wt-time { color: var(--wt-color); }
    #work-timer .wt-ring.is-paused .wt-time { color: var(--muted); }
    #work-timer .wt-ring.is-paused .wt-ring-track { stroke: var(--border); }
    #work-timer .wt-ring.is-paused .wt-ring-arc { stroke: var(--muted); }
    #work-timer .wt-info {
      min-height: 1.5em;
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    #work-timer .wt-controls {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      margin-top: 8px;
    }
    #work-timer .wt-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-weight: 600;
    }
    #work-timer .wt-btn:not(:disabled):hover { border-color: var(--wt-color); }
    #work-timer .wt-btn-primary {
      border-color: var(--wt-color);
      background: var(--wt-color);
      color: var(--accent-text);
    }
    #work-timer .wt-btn:disabled { opacity: 0.45; }

    /* "Keep screen on" toggle: a small pill whose dot fills in while it's on. */
    #work-timer .wt-wake {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font-size: 0.875rem;
    }
    #work-timer .wt-wake::before {
      content: "";
      width: 8px;
      height: 8px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
    }
    #work-timer .wt-wake:hover,
    #work-timer .wt-wake[aria-pressed="true"] { border-color: var(--accent); }
    #work-timer .wt-wake[aria-pressed="true"] { color: var(--accent); }
    #work-timer .wt-wake[aria-pressed="true"]::before { background: currentColor; }
    #work-timer .wt-wake-note { margin: -8px 0 0; color: var(--muted); font-size: 0.85rem; }
    #work-timer .wt-wake-note:empty { display: none; }

    /* Visually hidden, but read by screen readers. */
    #work-timer .wt-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Settings sidebar */
    #work-timer .wt-settings {
      padding: 14px 16px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
    }
    #work-timer .wt-settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #work-timer .wt-settings h2 { margin: 0; font-size: 1.1rem; }
    #work-timer .wt-close { width: 32px; height: 32px; }
    #work-timer .wt-group { margin-top: 14px; }
    #work-timer .wt-group + .wt-group { padding-top: 14px; border-top: 1px solid var(--border); }
    #work-timer .wt-group h3 {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    #work-timer .wt-field,
    #work-timer .wt-sound {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
    #work-timer .wt-num {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }
    /* Typed-in whole numbers: text inputs, so there are no up/down arrows. */
    #work-timer .wt-field input {
      width: 3.5em;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      text-align: right;
    }
    #work-timer .wt-field:has(input:disabled) { color: var(--muted); }
    #work-timer .wt-field input:disabled { opacity: 0.5; }
    #work-timer .wt-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 0;
    }
    #work-timer .wt-check input { margin: 0.25em 0 0; accent-color: var(--accent); }
    /* Sound previews: two small pills per row, Start and End, each with a play triangle. */
    #work-timer .wt-plays { display: flex; flex: none; gap: 6px; }
    #work-timer .wt-play {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 10px 2px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.85rem;
    }
    #work-timer .wt-play:hover { border-color: var(--accent); }
    #work-timer .wt-play svg { color: var(--accent); }
    #work-timer .wt-hint { margin: 14px 0 0; color: var(--muted); font-size: 0.85rem; }

    /* Wide screens: the sidebar is a column beside the timer. */
    @media (min-width: 721px) {
      #work-timer .wt-body.is-settings-open { grid-template-columns: minmax(0, 1fr) 260px; }
      #work-timer .wt-backdrop { display: none !important; }
    }

    /* Narrow screens: the sidebar opens over the timer from the right, above a dimmed backdrop. */
    @media (max-width: 720px) {
      #work-timer .wt-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0, 0, 0, 0.4);
      }
      #work-timer .wt-settings {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 21;
        width: min(320px, 88vw);
        overflow-y: auto;
        border-width: 0 0 0 1px;
        border-radius: 0;
        background: var(--surface);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.25);
      }
    }

    /* Floating window. While the timer is in it, .wt-away takes its place on the page. */
    #work-timer .wt-away {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px 0;
      color: var(--muted);
      text-align: center;
    }
    #work-timer .wt-away p { margin: 0; }
    #work-timer .wt-back {
      padding: 5px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: none;
      color: var(--text);
      font-size: 0.875rem;
    }
    #work-timer .wt-back:hover { border-color: var(--accent); }

    /* During a break, the card's grey text, the Keep screen on toggle and the focus outline take the
       break's ink, so they stand out on the green. */
    #work-timer.is-break .wt-ring-label,
    #work-timer.is-break .wt-info,
    #work-timer.is-break .wt-wake,
    #work-timer.is-break .wt-wake-note,
    #work-timer.is-break .wt-away { color: var(--wt-break-ink); }
    #work-timer.is-break .wt-wake:hover,
    #work-timer.is-break .wt-wake[aria-pressed="true"] { border-color: var(--wt-break-ink); }
    #work-timer.is-break :focus-visible { outline-color: var(--wt-break-ink); }

    /* In the floating window, the timer column sits in a div#work-timer.is-floating that fills the
       window. Only the buttons that do something show, and the layout changes with the window's size. */
    #work-timer.is-floating {
      container: wt-float / size;
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    #work-timer.is-floating .wt-main {
      container-type: normal;
      justify-content: center;
      gap: 10px;
      height: 100%;
      padding: 8px;
    }
    #work-timer.is-floating .wt-wake,
    #work-timer.is-floating .wt-wake-note,
    #work-timer.is-floating .wt-btn:disabled { display: none; }
    /* The panel takes the height the tabs leave and centers its content. The ring's box takes the
       height the info line and buttons leave, but no more than its width, so a tall window doesn't
       push the buttons away from the ring. The circle is drawn as large as the box allows, centered. */
    #work-timer.is-floating .wt-panel { flex: 1 1 0; min-height: 0; justify-content: center; gap: 6px; }
    #work-timer.is-floating .wt-ring {
      flex: 1 1 0;
      width: 100%;
      height: auto;
      min-height: 0;
      max-height: calc(100cqw - 16px);
    }
    #work-timer.is-floating .wt-info {
      max-width: 100%;
      overflow: hidden;
      font-size: 0.8rem;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #work-timer.is-floating .wt-controls { width: auto; margin-top: 0; }
    #work-timer.is-floating .wt-btn { flex: none; padding: 5px 14px; font-size: 0.875rem; }
    /* Shorter than 360px or narrower than 230px: the Work/Rest tabs and the info line go, leaving more
       room for the ring. The name inside the ring still says which timer is on show. */
    @container wt-float (height < 360px) or (width < 230px) {
      #work-timer.is-floating .wt-tabs,
      #work-timer.is-floating .wt-info { display: none; }
      #work-timer.is-floating .wt-btn { padding: 3px 12px; font-size: 13px; }
    }
    /* ...and more than 1.4 times as wide as tall: the buttons stack beside the ring, not below it. */
    @container wt-float ((height < 360px) or (width < 230px)) and (aspect-ratio > 7 / 5) {
      #work-timer.is-floating .wt-panel { flex-direction: row; justify-content: center; gap: 12px; }
      #work-timer.is-floating .wt-ring {
        flex: none;
        width: min(100cqh - 16px, 100cqw - 112px);
        height: min(100cqh - 16px, 100cqw - 112px);
      }
      #work-timer.is-floating .wt-controls { flex-direction: column; }
    }
    /* 100px tall or less: too small to fit the time inside the ring. A small ring sits beside the
       time instead, and the buttons join them on one line. */
    @container wt-float (height <= 100px) {
      #work-timer.is-floating .wt-panel { flex-direction: row; justify-content: center; gap: 10px; }
      #work-timer.is-floating .wt-ring {
        container-type: normal;
        display: flex;
        align-items: center;
        gap: 0.25em;
        flex: none;
        width: auto;
        height: auto;
        font-size: min(13cqw, 60cqh);
      }
      #work-timer.is-floating .wt-ring-svg { width: 0.8em; height: 0.8em; }
      #work-timer.is-floating .wt-ring-track,
      #work-timer.is-floating .wt-ring-arc { stroke-width: 10; }
      #work-timer.is-floating .wt-time { font-size: 1em; line-height: 1; }
      #work-timer.is-floating .wt-ring-label { display: none; }
      #work-timer.is-floating .wt-controls { flex-direction: row; }
      #work-timer.is-floating .wt-btn { padding: 2px 8px; font-size: 12px; }
    }
    /* ...and 280px wide or less: Reset goes too. */
    @container wt-float (height <= 100px) and (width <= 280px) {
      #work-timer.is-floating #wt-reset { display: none; }
    }

    /* ---------- Exercise (#exercise) ---------- */
    /* The ring is blue (the accent) while a step runs and amber during the get-ready countdown, each
       over a pale track of its own color, and grey while paused. */
    #exercise {
      --ex-work: #2f6fde;
      --ex-work-pale: #c1d4f5;
      --ex-ready: #a86500;
      --ex-ready-pale: #eee0cc;
    }
    @media (prefers-color-scheme: dark) {
      #exercise {
        --ex-work: #5b8ef0;
        --ex-work-pale: #2e4266;
        --ex-ready: #e0a040;
        --ex-ready-pale: #4a3a1e;
      }
    }
    #exercise [hidden] { display: none !important; }
    #exercise button,
    #exercise select { font: inherit; color: inherit; }
    #exercise button:not(:disabled) { cursor: pointer; }
    #exercise :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Routine picker */
    #exercise .ex-pick {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 20px;
    }
    #exercise .ex-pick label { color: var(--muted); }
    #exercise .ex-pick select {
      max-width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    #exercise .ex-pick select:disabled { opacity: 0.6; }

    /* The routine on the left and the list of its exercises on the right, or below on narrow screens. */
    #exercise .ex-body { display: grid; gap: 24px; align-items: start; }
    @media (min-width: 721px) {
      #exercise .ex-body { grid-template-columns: minmax(0, 1fr) 240px; }
    }
    #exercise .ex-main {
      container: ex-main / inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* The ring, with the exercise's name and description beside it. The count and the label under it
       are sized from the ring (a size container), like the Work Timer's. */
    #exercise .ex-stage { display: flex; align-items: center; gap: 24px; width: 100%; }
    #exercise .ex-ring {
      container-type: size;
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      place-items: center;
      flex: none;
      width: 200px;
      height: 200px;
    }
    #exercise .ex-ring > * { grid-area: 1 / 1; }
    #exercise .ex-ring-svg { width: 100%; height: 100%; overflow: visible; }
    #exercise .ex-ring-track,
    #exercise .ex-ring-arc { fill: none; stroke-width: 6; }
    #exercise .ex-ring-track { stroke: var(--ex-work-pale); }
    #exercise .ex-ring-arc { stroke: var(--ex-work); }
    #exercise .ex-ring.is-ready .ex-ring-track { stroke: var(--ex-ready-pale); }
    #exercise .ex-ring.is-ready .ex-ring-arc { stroke: var(--ex-ready); }
    #exercise .ex-ring.is-paused .ex-ring-track { stroke: var(--border); }
    #exercise .ex-ring.is-paused .ex-ring-arc { stroke: var(--muted); }
    #exercise .ex-ring-text { display: flex; flex-direction: column; align-items: center; }
    #exercise .ex-count {
      font-size: 30cqmin;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    #exercise .ex-ring.is-idle .ex-count { font-size: 20cqmin; }
    #exercise .ex-ring.is-paused .ex-count { color: var(--muted); }
    #exercise .ex-ring-label { color: var(--muted); font-size: max(12px, 8cqmin); line-height: 1.4; }
    #exercise .ex-text { flex: 1 1 0; min-width: 0; }
    #exercise .ex-meta { margin: 0 0 6px; color: var(--muted); font-size: 0.95rem; }
    #exercise .ex-name { margin: 0; font-size: 2rem; line-height: 1.35; }
    #exercise .ex-desc { margin: 8px 0 0; font-size: 1.1rem; }
    /* Too narrow for the text beside the ring: it goes under it, centered. */
    @container ex-main (max-width: 520px) {
      #exercise .ex-stage { flex-direction: column; gap: 16px; text-align: center; }
      #exercise .ex-ring { width: 180px; height: 180px; }
      #exercise .ex-name { font-size: 1.6rem; }
      #exercise .ex-desc { font-size: 1rem; }
    }
    #exercise .ex-info {
      min-height: 1.5em;
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }
    #exercise .ex-controls { display: flex; gap: 8px; width: 100%; max-width: 360px; }
    #exercise .ex-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-weight: 600;
    }
    #exercise .ex-btn:not(:disabled):hover { border-color: var(--ex-work); }
    #exercise .ex-btn-primary {
      border-color: var(--ex-work);
      background: var(--ex-work);
      color: var(--accent-text);
    }
    #exercise .ex-btn:disabled { opacity: 0.45; }

    /* The list of the routine's exercises, in small text and grouped by section, with a progress bar
       down its side: one segment per exercise, which fills as that exercise is done. While the routine
       isn't running, each name is a button that picks where to continue. */
    #exercise .ex-list { font-size: 0.85rem; }
    #exercise .ex-list-head { margin: 0; color: var(--muted); }
    #exercise .ex-group { margin: 14px 0 4px; color: var(--muted); font-weight: 600; }
    #exercise .ex-items { margin: 0; padding: 0; list-style: none; }
    #exercise .ex-item {
      display: flex;
      align-items: stretch;
      gap: 10px;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      text-align: left;
    }
    /* Each segment reaches 1px into the next row, so no seam shows between them. */
    #exercise .ex-bar {
      position: relative;
      flex: none;
      width: 4px;
      margin-bottom: -1px;
      overflow: hidden;
      background: var(--border);
    }
    #exercise li:first-child .ex-bar { border-radius: 2px 2px 0 0; }
    #exercise li:last-child .ex-bar { border-radius: 0 0 2px 2px; }
    #exercise li:only-child .ex-bar { border-radius: 2px; }
    #exercise .ex-fill {
      position: absolute;
      inset: 0;
      background: var(--ex-work);
      transform: scaleY(0);
      transform-origin: top;
    }
    #exercise .ex-item-name { padding: 3px 0; line-height: 20px; }
    #exercise .ex-item.is-done .ex-item-name { color: var(--muted); }
    #exercise .ex-item.is-current .ex-item-name { font-weight: 600; }
    #exercise .ex-item:not(:disabled):hover .ex-item-name { color: var(--accent); text-decoration: underline; }

    /* Visually hidden, but read by screen readers. */
    #exercise .ex-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Eye Exercise (#eye-exercise) ---------- */
    /* The ring is blue (the accent) over a pale blue track, the Work Timer's work shades, and grey
       while paused. */
    #eye-exercise {
      --ee-play: #2f6fde;
      --ee-play-pale: #c1d4f5;
    }
    @media (prefers-color-scheme: dark) {
      #eye-exercise {
        --ee-play: #5b8ef0;
        --ee-play-pale: #2e4266;
      }
    }
    #eye-exercise [hidden] { display: none !important; }
    #eye-exercise button { font: inherit; color: inherit; }
    #eye-exercise button:not(:disabled) { cursor: pointer; }
    #eye-exercise :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #eye-exercise .ee-main {
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* The ring, built like the Work Timer's. The count and the label under it are sized from the ring
       (a size container), so they scale with it. */
    #eye-exercise .ee-ring {
      container-type: size;
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      place-items: center;
      width: min(300px, 100cqi);
      height: min(300px, 100cqi);
    }
    #eye-exercise .ee-ring > * { grid-area: 1 / 1; }
    #eye-exercise .ee-ring-svg { width: 100%; height: 100%; overflow: visible; }
    #eye-exercise .ee-ring-track,
    #eye-exercise .ee-ring-arc { fill: none; stroke-width: 6; }
    #eye-exercise .ee-ring-track { stroke: var(--ee-play-pale); }
    #eye-exercise .ee-ring-arc { stroke: var(--ee-play); }
    #eye-exercise .ee-ring.is-paused .ee-ring-track,
    #eye-exercise .ee-ring.is-off .ee-ring-track { stroke: var(--border); }
    #eye-exercise .ee-ring.is-paused .ee-ring-arc,
    #eye-exercise .ee-ring.is-off .ee-ring-arc { stroke: var(--muted); }
    #eye-exercise .ee-ring-text { display: flex; flex-direction: column; align-items: center; }
    #eye-exercise .ee-count {
      font-size: 30cqmin;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    #eye-exercise .ee-ring.is-idle .ee-count { font-size: 22cqmin; }
    #eye-exercise .ee-ring.is-paused .ee-count { color: var(--muted); }
    #eye-exercise .ee-ring-label { color: var(--muted); font-size: max(12px, 7cqmin); line-height: 1.3; }

    #eye-exercise .ee-controls { display: flex; gap: 8px; width: 100%; max-width: 360px; margin-top: 8px; }
    #eye-exercise .ee-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-weight: 600;
    }
    #eye-exercise .ee-btn:not(:disabled):hover { border-color: var(--ee-play); }
    #eye-exercise .ee-btn-primary {
      border-color: var(--ee-play);
      background: var(--ee-play);
      color: var(--accent-text);
    }
    #eye-exercise .ee-btn:disabled { opacity: 0.45; }
    #eye-exercise .ee-note { margin: 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
    #eye-exercise .ee-note:empty { display: none; }

    /* Visually hidden, but read by screen readers. */
    #eye-exercise .ee-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Breathing (#breathing) ---------- */
    /* Each kind of part has its own color: blue to inhale, yellow to hold and green to exhale. On the
       ring, a part's stretch is a pale shade of its color until the arc fills it in the solid color.
       The blue and green are the Work Timer's work and rest shades. In light, the yellow is a deep
       golden yellow, since a bright one barely shows on white. The ring turns grey while paused. */
    #breathing {
      --br-inhale: #2f6fde;
      --br-inhale-pale: #c1d4f5;
      --br-hold: #c59711;
      --br-hold-pale: #eee0b8;
      --br-exhale: #318454;
      --br-exhale-pale: #c1dacc;
    }
    @media (prefers-color-scheme: dark) {
      #breathing {
        --br-inhale: #5b8ef0;
        --br-inhale-pale: #2e4266;
        --br-hold: #dab33a;
        --br-hold-pale: #4d4122;
        --br-exhale: #53ae77;
        --br-exhale-pale: #2f4a38;
      }
    }
    #breathing [hidden] { display: none !important; }
    #breathing button,
    #breathing select,
    #breathing input { font: inherit; color: inherit; }
    #breathing button:not(:disabled) { cursor: pointer; }
    #breathing :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #breathing .br-main {
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #breathing .br-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    /* The exercises' tabs: a switch like the Work Timer's Work/Rest. It wraps if they don't fit. */
    #breathing .br-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      max-width: 100%;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--bg);
    }
    #breathing .br-tabs button {
      min-width: 92px;
      padding: 6px 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: none;
      color: var(--muted);
      white-space: nowrap;
    }
    #breathing .br-tabs button:not(:disabled):hover { color: var(--text); }
    #breathing .br-tabs button[aria-selected="true"] {
      border-color: var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
    }
    #breathing .br-tabs button:disabled:not([aria-selected="true"]) { opacity: 0.45; }
    @container (max-width: 340px) {
      #breathing .br-tabs button { min-width: 0; padding: 6px 12px; }
    }

    /* Session length: a drop-down, and under Other a box beside it to type the minutes in. */
    #breathing .br-length {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 10px;
    }
    #breathing .br-length label { color: var(--muted); }
    #breathing .br-length select,
    #breathing .br-other input {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    #breathing .br-length select { padding: 6px 10px; }
    #breathing .br-other { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    /* Typed-in whole minutes: a text input, so there are no up/down arrows. */
    #breathing .br-other input { width: 3.5em; padding: 5px 8px; color: var(--text); text-align: right; }
    #breathing .br-length select:disabled,
    #breathing .br-other input:disabled { opacity: 0.6; }

    /* The ring shows one cycle, from the top and clockwise: a stretch per part, each as long as its
       share of the cycle, with a small gap between. The count and the label under it are sized from
       the ring (a size container), so they scale with it. */
    #breathing .br-ring {
      container-type: size;
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      place-items: center;
      width: min(300px, 100cqi);
      height: min(300px, 100cqi);
    }
    #breathing .br-ring > * { grid-area: 1 / 1; }
    #breathing .br-ring-svg { width: 100%; height: 100%; overflow: visible; }
    #breathing .br-ring-svg path { fill: none; stroke-width: 6; }
    #breathing .br-track .is-inhale { stroke: var(--br-inhale-pale); }
    #breathing .br-track .is-hold { stroke: var(--br-hold-pale); }
    #breathing .br-track .is-exhale { stroke: var(--br-exhale-pale); }
    #breathing .br-fill .is-inhale { stroke: var(--br-inhale); }
    #breathing .br-fill .is-hold { stroke: var(--br-hold); }
    #breathing .br-fill .is-exhale { stroke: var(--br-exhale); }
    #breathing .br-ring.is-paused .br-track path { stroke: var(--border); }
    #breathing .br-ring-text { display: flex; flex-direction: column; align-items: center; }
    #breathing .br-count {
      font-size: 22cqmin;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    #breathing .br-ring.is-ready .br-count,
    #breathing .br-ring.is-done .br-count { font-size: 30cqmin; }
    #breathing .br-ring.is-paused .br-count { color: var(--muted); }
    #breathing .br-ring-label { color: var(--muted); font-size: max(13px, 8cqmin); line-height: 1.3; }
    #breathing .br-ring.is-breathing .br-ring-label { color: var(--text); font-weight: 600; }

    /* The color key: the parts of one cycle, in order, each after a dot in its color. */
    #breathing .br-key {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 16px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.95rem;
    }
    #breathing .br-key li { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    #breathing .br-key li::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--br-dot);
    }
    #breathing .br-key .is-inhale { --br-dot: var(--br-inhale); }
    #breathing .br-key .is-hold { --br-dot: var(--br-hold); }
    #breathing .br-key .is-exhale { --br-dot: var(--br-exhale); }

    #breathing .br-controls { display: flex; gap: 8px; width: 100%; max-width: 360px; margin-top: 8px; }
    #breathing .br-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-weight: 600;
    }
    #breathing .br-btn:not(:disabled):hover { border-color: var(--accent); }
    #breathing .br-btn-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }
    #breathing .br-btn:disabled { opacity: 0.45; }

    /* Visually hidden, but read by screen readers. */
    #breathing .br-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

  </style>

<body>
  <header class="app-header">
    <div class="container">
      <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    </div>
  </header>

  <main class="container">
    <!-- ==========================================================
         Pages: each <section class="page"> below becomes one tab, in this order.
         To add a page, copy a section and give it:

           - a data-title (the tab label, also used as the browser tab title)
         The tab bar is built automatically. See SPEC.md for the full conventions.
         ========================================================== -->

    <section class="page" id="work-timer" data-title="Work Timer">
      <h1>Work Timer</h1>
      <button type="button" class="wt-icon-btn wt-float" id="wt-float" aria-pressed="false" aria-label="Floating window" title="Floating window" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="12" y="11" width="6" height="5" rx="1" fill="currentColor"/></svg>
      </button>
      <button type="button" class="wt-icon-btn wt-gear" id="wt-gear" aria-expanded="false" aria-controls="wt-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10.10 4.33L10.36 1.63A10.5 10.5 0 0 1 13.64 1.63L13.90 4.33A7.9 7.9 0 0 1 16.07 5.23L18.17 3.51A10.5 10.5 0 0 1 20.49 5.83L18.77 7.93A7.9 7.9 0 0 1 19.67 10.10L22.37 10.36A10.5 10.5 0 0 1 22.37 13.64L19.67 13.90A7.9 7.9 0 0 1 18.77 16.07L20.49 18.17A10.5 10.5 0 0 1 18.17 20.49L16.07 18.77A7.9 7.9 0 0 1 13.90 19.67L13.64 22.37A10.5 10.5 0 0 1 10.36 22.37L10.10 19.67A7.9 7.9 0 0 1 7.93 18.77L5.83 20.49A10.5 10.5 0 0 1 3.51 18.17L5.23 16.07A7.9 7.9 0 0 1 4.33 13.90L1.63 13.64A10.5 10.5 0 0 1 1.63 10.36L4.33 10.10A7.9 7.9 0 0 1 5.23 7.93L3.51 5.83A10.5 10.5 0 0 1 5.83 3.51L7.93 5.23A7.9 7.9 0 0 1 10.10 4.33ZM15.20 12.00A3.2 3.2 0 1 0 8.80 12.00A3.2 3.2 0 1 0 15.20 12.00Z"/></svg>
      </button>

      <div class="wt-body">
        <div class="wt-main">
          <div class="wt-tabs" role="tablist" aria-label="Timers">
            <button type="button" role="tab" id="wt-tab-work" aria-controls="wt-panel" aria-selected="true">Work</button>
            <button type="button" role="tab" id="wt-tab-rest" aria-controls="wt-panel" aria-selected="false" tabindex="-1">Rest</button>
          </div>

                <circle class="wt-ring-track" cx="50" cy="50" r="45"/>

              </svg>

            <p class="wt-info" id="wt-info"></p>
            <div class="wt-controls">

              <button type="button" class="wt-btn" id="wt-pause" disabled>Pause</button>
              <button type="button" class="wt-btn" id="wt-reset" disabled>Reset</button>

          </div>

          <button type="button" class="wt-wake" id="wt-wake" aria-pressed="false" hidden>Keep screen on</button>

        <div class="wt-away" id="wt-away" hidden>

        </div>

        <div class="wt-backdrop" id="wt-backdrop" hidden></div>

        <aside class="wt-settings" id="wt-settings" aria-labelledby="wt-settings-title" hidden>

            </button>
          </div>

                <button type="button" class="wt-play" data-sound="work_begin" aria-label="Play the work start sound"><svg viewBox="7 5 14 14" width="10" height="10" aria-hidden="true"><path fill="currentColor" d="M9 5.5v13l10-6.5z"/></svg>Start</button>
                <button type="button" class="wt-play" data-sound="work_end" aria-label="Play the work end sound"><svg viewBox="7 5 14 14" width="10" height="10" aria-hidden="true"><path fill="currentColor" d="M9 5.5v13l10-6.5z"/></svg>End</button>

                <button type="button" class="wt-play" data-sound="rest_end" aria-label="Play the rest end sound"><svg viewBox="7 5 14 14" width="10" height="10" aria-hidden="true"><path fill="currentColor" d="M9 5.5v13l10-6.5z"/></svg>End</button>
              </span>

              <span class="wt-plays">
                <button type="button" class="wt-play" data-sound="break_begin" aria-label="Play the break start sound"><svg viewBox="7 5 14 14" width="10" height="10" aria-hidden="true"><path fill="currentColor" d="M9 5.5v13l10-6.5z"/></svg>Start</button>
                <button type="button" class="wt-play" data-sound="break_end" aria-label="Play the break end sound"><svg viewBox="7 5 14 14" width="10" height="10" aria-hidden="true"><path fill="currentColor" d="M9 5.5v13l10-6.5z"/></svg>End</button>
              </span>

  <!-- Shared: builds the tab bar and shows the page named in the URL. -->
  <script>
    (() => {
      const pages = [...document.querySelectorAll('main > section.page')];
      if (pages.length === 0) return;

      const nav = document.getElementById('tabs');
      const titleOf = (page) => page.dataset.title || page.id;

      const links = pages.map((page) => {
        const link = document.createElement('a');
        link.href = '#/' + page.id;
        link.textContent = titleOf(page);
        nav.appendChild(link);
        return link;
      });

      function showPage() {
        const id = location.hash.replace(/^#\/?/, '');
        const active = Math.max(0, pages.findIndex((page) => page.id === id));
        pages.forEach((page, i) => page.classList.toggle('is-active', i === active));
        links.forEach((link, i) => {
          if (i === active) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        });
        document.title = titleOf(pages[active]);
      }

      window.addEventListener('hashchange', showPage);
      showPage();
    })();
  </script>

  <!-- ============================================================
       Page scripts: give each page its own <script> element below,
       wrapped in (() => { ... })(); so its variables stay private and
       an error in one page can't break the others or the tab bar.
       ============================================================ -->

  <!-- Work Timer: work and rest countdowns, random short breaks, sounds, settings sidebar, screen wake
       lock, floating window. -->
  <script>
    (() => {
      const page = document.getElementById('work-timer');
      if (!page) return;
      const $ = (selector) => page.querySelector(selector);

      const MINUTE = 60 * 1000;
      const KINDS = ['work', 'rest'];
      const LABELS = { work: 'Work', rest: 'Rest' };
      const other = (kind) => (kind === 'work' ? 'rest' : 'work');

      const tabs = { work: $('#wt-tab-work'), rest: $('#wt-tab-rest') };
      const panel = $('#wt-panel');
      const ringEl = $('#wt-ring');
      const arcEl = $('#wt-ring-arc');
      const ringLabel = $('#wt-ring-label');
      const timeEl = $('#wt-time');
      const infoEl = $('#wt-info');
      const startBtn = $('#wt-start');
      const pauseBtn = $('#wt-pause');
      const resetBtn = $('#wt-reset');
      const liveEl = $('#wt-live');
      const gear = $('#wt-gear');
      const sidebar = $('#wt-settings');
      const backdrop = $('#wt-backdrop');
      const closeBtn = $('#wt-close');
      const body = $('.wt-body');
      const inputs = {
        workMin: $('#wt-work-min'),
        restMin: $('#wt-rest-min'),
        breakSec: $('#wt-break-sec'),
        gapMinMin: $('#wt-gap-min'),
        gapMaxMin: $('#wt-gap-max'),
      };
      const breaksBox = $('#wt-breaks-on');
      const soundRadios = [...page.querySelectorAll('input[name="wt-sounds"]')];
      const wakeBtn = $('#wt-wake');
      const wakeNote = $('#wt-wake-note');
      const main = $('.wt-main');
      const floatBtn = $('#wt-float');
      const away = $('#wt-away');
      const backBtn = $('#wt-back');

      // ---------- Settings, remembered in localStorage ----------

      const STORAGE_KEY = 'misc-utils:work-timer';
      // remindOn switches the random breaks on and off. The name dates from when they were single
      // reminder dings, and is kept so that saved settings carry over. sounds picks the recorded
      // sounds or the dings.
      const DEFAULTS = {
        workMin: 25, restMin: 5, remindOn: true, gapMinMin: 2, gapMaxMin: 5, breakSec: 10, sounds: 'recorded',
      };
      const SOUND_CHOICES = ['recorded', 'dings'];
      // [lowest, highest]: every setting is a whole number, of minutes, or of seconds for the break
      // length. The shortest gap also stays below the longest (see the inputs' change handler).
      const LIMITS = {
        workMin: [10, 120],
        restMin: [3, 30],
        gapMinMin: [1, 5],
        gapMaxMin: [2, 10],
        breakSec: [5, 15],
      };

      // Rounds to a whole number and clamps to the limits. Returns null if n isn't a number.
      const clean = (n, [lo, hi]) =>
        typeof n === 'number' && Number.isFinite(n) ? Math.min(hi, Math.max(lo, Math.round(n))) : null;

      function loadSettings() {
        const s = { ...DEFAULTS };
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && typeof saved === 'object') {
            for (const key in LIMITS) {
              const n = clean(saved[key], LIMITS[key]);
              if (n !== null) s[key] = n;
            }
            if (typeof saved.remindOn === 'boolean') s.remindOn = saved.remindOn;
            if (SOUND_CHOICES.includes(saved.sounds)) s.sounds = saved.sounds;
          }
        } catch (e) { /* storage unavailable or unreadable: use the defaults */ }
        if (s.gapMinMin >= s.gapMaxMin) {
          s.gapMinMin = DEFAULTS.gapMinMin;
          s.gapMaxMin = DEFAULTS.gapMaxMin;
        }
        return s;
      }

      function saveSettings() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) { /* not saved, which is fine */ }
      }

      const settings = loadSettings();
      const durationMs = (kind) => (kind === 'work' ? settings.workMin : settings.restMin) * MINUTE;
      const breakMs = () => settings.breakSec * 1000;

      // ---------- Sounds ----------
      // Six moments have a sound, named after their files in timer_sound/: the start and end of a work
      // session (work_begin, work_end), of a rest session (rest_begin, rest_end) and of a break
      // (break_begin, break_end). By default each plays its recording, embedded at the end of this
      // page. With the Dings setting, each plays one of three dings generated with the Web Audio API.

      // The ding for each moment. It also plays in place of a recording this browser can't decode.
      const DING_FOR = {
        work_begin: 'start', work_end: 'end',
        rest_begin: 'start', rest_end: 'end',
        break_begin: 'ding', break_end: 'ding',
      };
      // Every ding note is a soft bell: four sine partials with a 5 ms attack and an exponential fade.
      // The higher partials are quieter and fade sooner.
      const PARTIALS = [
        { ratio: 1, level: 1, fade: 1 },
        { ratio: 2, level: 0.4, fade: 0.6 },
        { ratio: 3, level: 0.18, fade: 0.4 },
        { ratio: 4.16, level: 0.08, fade: 0.25 },
      ];
      // Each note: [start (s), frequency (Hz), peak level, fade time (s)].
      const DINGS = {
        ding: [[0, 880, 0.5, 2]],                                         // the break ding: A5
        start: [[0, 783.99, 0.42, 1.2], [0.16, 1174.66, 0.42, 1.6]],      // rising: G5, D6
        end: [[0, 1046.5, 0.45, 1.4], [0.2, 783.99, 0.45, 1.4],           // falling: C6, G5, E5, C5
              [0.4, 659.25, 0.45, 1.6], [0.6, 523.25, 0.45, 3]],
      };

      let ctx = null;     // the AudioContext, created by the first click that needs sound
      let master = null;
      let suspendTimer = 0;
      const recordings = {};       // moment → its decoded recording (an AudioBuffer)
      let recordingsReady = null;  // settles once every recording is decoded, or has failed to
      let recordingsDone = false;
      const playing = new Set();   // sounds scheduled or playing, until they end or are cancelled

      // Returns the audio context, creating or waking it. Browsers allow sound only after a user
      // gesture, so the first call comes from a click (Start, Resume or a play button). Creating the
      // context also starts decoding the recordings.
      function audio() {
        clearTimeout(suspendTimer);
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
          master = ctx.createGain();
          master.gain.value = 0.9;
          master.connect(ctx.destination);
          recordingsReady = decodeRecordings().then(() => { recordingsDone = true; });
        }
        if (ctx.state !== 'running') ctx.resume().catch(() => {});
        return ctx;
      }

      // Decodes the recordings at the end of the page. Each script.wt-recording element holds one as
      // base64, and its data-files names the moments it plays at. If the first click came while the
      // page was still loading, this waits for the rest of the page first.
      function decodeRecordings() {
        const pageLoaded = document.readyState === 'loading'
          ? new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve, { once: true }))
          : Promise.resolve();
        return pageLoaded.then(() => Promise.all(
          [...document.querySelectorAll('script.wt-recording')].map((el) => Promise.resolve()
            .then(() => ctx.decodeAudioData(Uint8Array.from(atob(el.textContent), (c) => c.charCodeAt(0)).buffer))
            .then((buffer) => el.dataset.files.split(/\s+/).forEach((name) => { recordings[name] = buffer; }))
            .catch(() => { /* this browser can't decode it: its moments play their dings instead */ })),
        ));
      }

      // Lets the audio device idle once no timer is running and the last sound has ended.
      function suspendSoon() {
        clearTimeout(suspendTimer);
        suspendTimer = setTimeout(() => {
          if (!ctx || runningKind()) return;
          if (playing.size) suspendSoon();  // a sound is still playing: check again later
          else ctx.suspend().catch(() => {});
        }, 5000);
      }

      // Schedules the ding `name` at t on the audio clock, into bus. Returns its oscillators.
      function scheduleDing(name, t, bus) {
        const oscillators = [];
        for (const [at, freq, level, fade] of DINGS[name]) {
          const t0 = t + at;
          for (const p of PARTIALS) {
            const t1 = t0 + fade * p.fade;
            const osc = ctx.createOscillator();
            const env = ctx.createGain();
            osc.frequency.value = freq * p.ratio;
            env.gain.setValueAtTime(0, t0);
            env.gain.linearRampToValueAtTime(level * p.level, t0 + 0.005);
            env.gain.exponentialRampToValueAtTime(0.0001, t1);
            osc.connect(env);
            env.connect(bus);
            osc.start(t0);
            osc.stop(t1 + 0.05);
            oscillators.push(osc);
          }
        }
        return oscillators;
      }

      // Schedules the sound of a moment (work_begin … break_end) at `when` on the audio clock: its
      // recording, or its ding with the Dings setting. A recording that is still being decoded starts
      // once it's ready: at `when`, or at once if that has passed.
      // Returns a handle: { when, started(), cancel() }.
      function playSound(name, when) {
        const bus = ctx.createGain();
        bus.connect(master);
        let sources = [];
        let over = false;
        const end = () => {
          if (over) return;
          over = true;
          bus.disconnect();
          playing.delete(sound);
        };
        const sound = {
          when,
          started: () => sources.length > 0 && sound.when <= ctx.currentTime,
          cancel() {
            sources.forEach((src) => { try { src.stop(); } catch (e) { /* already stopped */ } });
            end();
          },
        };
        const schedule = () => {
          if (over) return;  // cancelled while waiting for the recordings
          const t = Math.max(when, ctx.currentTime + 0.03);
          const buffer = settings.sounds === 'recorded' ? recordings[name] : null;
          if (buffer) {
            const src = ctx.createBufferSource();
            src.buffer = buffer;
            src.connect(bus);
            src.start(t);
            sources = [src];
          } else {
            sources = scheduleDing(DING_FOR[name], t, bus);
          }
          sound.when = t;
          // Once all of its sources have ended, the sound's nodes can go.
          let left = sources.length;
          sources.forEach((src) => { src.onended = () => { if (--left === 0) end(); }; });
        };
        playing.add(sound);
        if (settings.sounds === 'recorded' && !recordingsDone) recordingsReady.then(schedule);
        else schedule();
        return sound;
      }

      const playNow = (name) => playSound(name, ctx.currentTime + 0.03);
      // The audio-clock time for a wall-clock time (ms since 1970).
      const audioTime = (wallMs) => ctx.currentTime + Math.max(0.03, (wallMs - Date.now()) / 1000);
      // How far the wall clock is ahead of the audio clock, in seconds. It jumps if the audio clock
      // stalls while the wall clock keeps going, as when a computer sleeps.
      const clockOffset = () => Date.now() / 1000 - ctx.currentTime;

      // ---------- Timers ----------

      // total: the length of the current session (a changed duration applies from the next one).
      const timers = {
        work: { total: durationMs('work'), remaining: durationMs('work'), started: false, running: false, endAt: 0 },
        rest: { total: durationMs('rest'), remaining: durationMs('rest'), started: false, running: false, endAt: 0 },
      };
      let view = 'work';  // the timer tab on show
      let notice = '';    // shown after a session ends, until the next click

      const runningKind = () => KINDS.find((kind) => timers[kind].running) || null;
      const remainingMs = (kind) => {
        const t = timers[kind];
        return t.running ? Math.max(0, t.endAt - Date.now()) : t.remaining;
      };

      // ---------- Random breaks, and sounds scheduled ahead on the audio clock ----------
      // While work runs, short breaks come at random times: a sound starts each one and another ends
      // it. The work clock keeps running through them. Breaks are planned ahead in wall-clock time, so
      // they show on screen even without sound. Background tabs can run timers late, but sounds
      // scheduled on the audio clock play on time, so the break sounds and the end sound go there.

      const BREAK_AHEAD = 5 * MINUTE;    // how far ahead breaks are planned
      const BREAK_END_GAP = 15 * 1000;   // a break ends at least 15 seconds before its session does

      let endSound = null;      // handle of the scheduled end sound
      let breaks = [];          // planned breaks, oldest first: { at, end (wall-clock ms), sounds (handles) }
      let nextBreakAt = 0;      // wall-clock start of the next break not planned yet
      let pausedGap = null;     // on pause, the work time that was left until the next break
      let shownBreak = null;    // the break in progress, as last shown by tick(); null between breaks
      let syncedOffset = 0;     // clockOffset() when the session sounds were scheduled

      const randomGap = () => {
        const lo = settings.gapMinMin * MINUTE;
        const hi = settings.gapMaxMin * MINUTE;
        return lo + Math.random() * (hi - lo);
      };

      // Schedules the sounds of break b that are still ahead of `now`: break_begin at its start and
      // break_end at its end.
      const breakSounds = (b, now) => (ctx
        ? [[b.at, 'break_begin'], [b.end, 'break_end']]
          .filter(([t]) => t > now)
          .map(([t, name]) => playSound(name, audioTime(t)))
        : []);

      // Cancels the sounds of break b that haven't started yet. One that is playing plays out.
      function cancelBreakSounds(b) {
        b.sounds.forEach((sound) => { if (!sound.started()) sound.cancel(); });
        b.sounds = [];
      }

      // Keeps breaks planned up to BREAK_AHEAD into the future. Runs on every tick.
      function planBreaks(now) {
        const t = timers.work;
        if (!t.running || !settings.remindOn) return;
        breaks = breaks.filter((b) => b.end > now - 10000);
        const length = breakMs();
        while (nextBreakAt < now) nextBreakAt += length + randomGap();  // skip any missed while asleep
        // A break starts only if it can end BREAK_END_GAP before the session does.
        const until = Math.min(now + BREAK_AHEAD, t.endAt - BREAK_END_GAP - length);
        while (nextBreakAt <= until) {
          const b = { at: nextBreakAt, end: nextBreakAt + length, sounds: [] };
          b.sounds = breakSounds(b, now);
          breaks.push(b);
          nextBreakAt = b.end + randomGap();  // a gap is the work time between two breaks
        }
      }

      // Drops every planned break. A break in progress ends silently.
      function cancelBreaks() {
        breaks.forEach(cancelBreakSounds);
        breaks = [];
        shownBreak = null;
      }

      const currentBreak = (now) => breaks.find((b) => b.at <= now && now < b.end) || null;

      // When the next break starts: the first planned one still ahead, or else the next one not planned yet.
      function nextBreakStart(now) {
        const upcoming = breaks.find((b) => b.at > now);
        return upcoming ? upcoming.at : nextBreakAt;
      }

      function scheduleSession(kind) {
        if (ctx) {
          syncedOffset = clockOffset();
          endSound = playSound(kind + '_end', audioTime(timers[kind].endAt));
        }
        if (kind === 'work') planBreaks(Date.now());
      }

      function cancelSession() {
        if (endSound) endSound.cancel();
        endSound = null;
        cancelBreaks();
      }

      // Schedules the running session's sounds again from their wall-clock times: its end sound, and
      // the planned breaks' sounds that haven't started. Sounds whose time has passed are dropped.
      function rescheduleSounds(kind) {
        const now = Date.now();
        syncedOffset = clockOffset();
        if (endSound) endSound.cancel();
        endSound = playSound(kind + '_end', audioTime(timers[kind].endAt));
        breaks.forEach((b) => {
          cancelBreakSounds(b);
          b.sounds = breakSounds(b, now);
        });
      }

      // If the audio clock stalled while the wall clock kept going (as when a computer sleeps),
      // schedule the sounds again.
      function resyncSounds(kind) {
        if (!ctx || ctx.state !== 'running' || Math.abs(clockOffset() - syncedOffset) < 1) return;
        rescheduleSounds(kind);
      }

      // ---------- Start, pause, reset, finish ----------

      function start(kind) {
        const t = timers[kind];
        if (t.running) return;
        audio();
        if (timers[other(kind)].started) resetTimer(other(kind));
        const now = Date.now();
        const fresh = !t.started;
        if (fresh) {
          t.started = true;
          t.total = t.remaining = durationMs(kind);
          if (ctx) playNow(kind + '_begin');
        }
        if (kind === 'work') nextBreakAt = now + (fresh || pausedGap === null ? randomGap() : pausedGap);
        pausedGap = null;
        t.running = true;
        t.endAt = now + t.remaining;
        notice = '';
        scheduleSession(kind);
        startTicking();
        render();
      }

      function pause(kind) {
        const t = timers[kind];
        if (!t.running) return;
        const now = Date.now();
        if (now >= t.endAt) { finish(kind); return; }
        t.remaining = t.endAt - now;
        t.running = false;
        // Resume carries on with the work time that was left before the next break. Pausing during a
        // break ends that break instead (the pause is a break in itself), and Resume draws a fresh gap.
        if (kind === 'work') {
          pausedGap = settings.remindOn && !currentBreak(now) ? Math.max(0, nextBreakStart(now) - now) : null;
        }
        cancelSession();
        stopTicking();
        render();
        suspendSoon();
      }

      // Stops a timer and puts it back to its full time, silently.
      function resetTimer(kind) {
        const t = timers[kind];
        if (t.running) {
          cancelSession();
          stopTicking();
        }
        t.running = false;
        t.started = false;
        t.total = t.remaining = durationMs(kind);
        if (kind === 'work') pausedGap = null;
      }

      function reset(kind) {
        resetTimer(kind);
        notice = '';
        render();
        suspendSoon();
      }

      // Runs when the running timer reaches zero.
      function finish(kind) {
        // The end sound is normally already playing from its schedule. If the audio clock fell
        // behind (it stalls while a computer sleeps), play it now instead.
        if (endSound && ctx && endSound.when > ctx.currentTime + 0.5) {
          endSound.cancel();
          endSound = null;
        }
        if (!endSound && ctx && ctx.state === 'running') playNow(kind + '_end');
        endSound = null;  // let it ring: resetTimer() below must not cancel it
        resetTimer(kind);
        view = other(kind);
        notice = kind === 'work'
          ? 'Work session done. Start your rest when you’re ready.'
          : 'Rest is over. Start the next work session when you’re ready.';
        announce(notice);
        render();
        suspendSoon();
      }

      // Reads a message out to screen readers. The live region is emptied first, so that the same
      // message is announced again if it repeats.
      function announce(message) {
        liveEl.textContent = '';
        setTimeout(() => { liveEl.textContent = message; }, 100);
      }

      // ---------- Ticking ----------
      // A 250 ms interval keeps the display current. Background tabs slow intervals down (Chrome
      // to once a minute), so a chain of silent one-second sounds also calls tick() from their
      // "ended" events, which aren't slowed. While the floating window is open, a second 250 ms
      // interval runs on that window: it stays on screen, so its timers aren't slowed even while
      // this tab is hidden. tick() is safe to call at any time.

      let intervalId = 0;
      let floatWin = null;      // the floating window, while it's open
      let floatShell = null;    // the div#work-timer that holds the timer in the floating window
      let floatIntervalId = 0;  // the interval on the floating window
      let audioTicking = false;

      function startTicking() {
        if (!intervalId) intervalId = setInterval(tick, 250);
        if (floatWin && !floatIntervalId) floatIntervalId = floatWin.setInterval(tick, 250);
        if (!audioTicking && ctx && ctx.createConstantSource) {
          audioTicking = true;
          audioTick();
        }
      }

      function audioTick() {
        if (!runningKind()) {
          audioTicking = false;
          return;
        }
        const src = ctx.createConstantSource();
        src.offset.value = 0;
        src.connect(ctx.destination);
        src.onended = () => {
          src.disconnect();
          tick();
          audioTick();
        };
        src.start();
        src.stop(ctx.currentTime + 1);

      function stopTicking() {
        clearInterval(intervalId);
        intervalId = 0;  // the silent chain stops by itself at its next step
        if (floatWin) floatWin.clearInterval(floatIntervalId);

      function tick() {
        const kind = runningKind();
        if (!kind) return;
        if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
        resyncSounds(kind);
        const now = Date.now();
        if (now >= timers[kind].endAt) {
          finish(kind);
          return;
        }
        if (kind === 'work') {
          planBreaks(now);
          const b = currentBreak(now);
          if (b !== shownBreak) {
            // A break starts or ends. When one starts, the Work timer comes on show if it wasn't.
            if (b) view = 'work';

      // ---------- Display ----------

      const formatTime = (ms) => {

      // The ring's arc starts at the top and runs clockwise, as long as the share of the session left:
      // full while idle, shrinking back toward the top as the time runs down. During a break, the time
      // and the ring show the break: its time left, out of its length.
      const RING_LENGTH = 2 * Math.PI * 45;  // the ring's circumference (radius 45 in its viewBox)

      function renderTime() {
        const b = breakOnShow();
        const ms = b ? breakLeftMs(b) : remainingMs(view);

        if (timeEl.textContent !== text) timeEl.textContent = text;
        const share = Math.min(1, ms / (b ? b.end - b.at : timers[view].total));

            : `${formatTime(remainingMs(kind))} · ${LABELS[kind]}`;
          if (document.title !== text) document.title = text;
          titleIsCountdown = true;
        } else if (titleIsCountdown) {

      // The browser tab's icon: a green dot during a break, and otherwise a blank (transparent) icon.
      // A blank icon rather than none, because browsers don't reliably bring back their default icon
      // when a page removes its own, so a removed dot could stay on show.

      const ICON_BLANK = svgIcon('');
      const ICON_BREAK = svgIcon('<circle cx="8" cy="8" r="7" fill="#479d32"/>');
      const tabIcon = document.createElement('link');
      tabIcon.rel = 'icon';
      document.head.append(tabIcon);

      function renderIcon() {
        const href = shownBreak ? ICON_BREAK : ICON_BLANK;
        if (tabIcon.getAttribute('href') !== href) tabIcon.setAttribute('href', href);
      }

      function render() {

        // The card behind the timer (the page, and the floating window while it's open) and
        // everything on it take the colors of the timer on show (CSS: Work's, or Rest's with is-rest),
        // or the break's own green during a break (is-break).
        const onBreak = breakOnShow() !== null;
        page.classList.toggle('is-rest', view === 'rest');
        page.classList.toggle('is-break', onBreak);
        if (floatShell) {
          floatShell.classList.toggle('is-rest', view === 'rest');
          floatShell.classList.toggle('is-break', onBreak);
        }
        ringLabel.textContent = onBreak ? 'Break' : LABELS[view];
        const t = timers[view];
        const paused = t.started && !t.running;
        ringEl.classList.toggle('is-running', t.running);
        ringEl.classList.toggle('is-paused', paused);
        renderTime();
        startBtn.textContent = paused ? 'Resume' : 'Start';
        startBtn.disabled = t.running;
        pauseBtn.disabled = !t.running;
        resetBtn.disabled = !t.started;
        infoEl.textContent = notice ||
          (paused ? 'Paused' : onBreak ? 'Take a short break' : view === 'work' ? breakText() : '');

      // ---------- Timer controls ----------

      // If the clicked button disables itself, move focus on so keyboard users aren't stranded.
      // The button may be in the floating window, so focus is checked in its own document.
      function onPress(button, action, focusNext) {
        button.addEventListener('click', () => {
          const hadFocus = button.ownerDocument.activeElement === button;
          action();
          if (hadFocus && button.disabled) focusNext.focus();
        });
      }
      onPress(startBtn, () => start(view), pauseBtn);
      onPress(pauseBtn, () => pause(view), startBtn);
      onPress(resetBtn, () => reset(view), startBtn);

      function showTimer(kind) {
        if (kind === view) return;
        view = kind;
        notice = '';
        render();
      }
      for (const kind of KINDS) {
        tabs[kind].addEventListener('click', () => showTimer(kind));
        tabs[kind].addEventListener('keydown', (e) => {
          const next = { ArrowLeft: other(kind), ArrowRight: other(kind), Home: 'work', End: 'rest' }[e.key];
          if (!next) return;
          e.preventDefault();
          showTimer(next);
          tabs[next].focus();

      // ---------- Settings sidebar ----------

      function setSidebar(open) {

      backdrop.addEventListener('click', () => setSidebar(false));
      document.addEventListener('keydown', (e) => {

      });

      function fillSettings() {
        for (const key in inputs) inputs[key].value = settings[key];
        breaksBox.checked = settings.remindOn;
        inputs.breakSec.disabled = inputs.gapMinMin.disabled = inputs.gapMaxMin.disabled = !settings.remindOn;
        soundRadios.forEach((radio) => { radio.checked = radio.value === settings.sounds; });
      }

      function applySettings(key) {
        if (key === 'workMin' || key === 'restMin') {
          // A new duration shows at once on an idle timer. A session in progress keeps its length.
          const kind = key === 'workMin' ? 'work' : 'rest';
          if (!timers[kind].started) timers[kind].total = timers[kind].remaining = durationMs(kind);
        } else {
          // Break changes apply at once: drop the planned breaks (a break in progress ends silently)
          // and draw a fresh gap.
          pausedGap = null;
          cancelBreaks();
          if (timers.work.running) {
            nextBreakAt = Date.now() + randomGap();
            planBreaks(Date.now());
          }
        }
        render();
      }

      // The settings are typed in, so an entry is read from the text: an empty field or anything that
      // isn't a number gives NaN, which clean() turns down.
      const typed = (input) => (input.value.trim() === '' ? NaN : Number(input.value));

      for (const key in inputs) {
        inputs[key].addEventListener('change', () => {
          const n = clean(typed(inputs[key]), LIMITS[key]);
          if (n !== null && n !== settings[key]) {
            settings[key] = n;
            // The shortest gap stays below the longest: an entry that would meet or pass the other
            // moves the other to 1 minute away. The limits keep it in range (shortest at most 5,
            // longest at least 2).
            if (key === 'gapMinMin' && settings.gapMaxMin <= n) settings.gapMaxMin = n + 1;
            if (key === 'gapMaxMin' && settings.gapMinMin >= n) settings.gapMinMin = n - 1;
            saveSettings();
            applySettings(key);
          }
          fillSettings();  // shows the cleaned value, or the old one if the entry wasn't a number
        });
      }
      breaksBox.addEventListener('change', () => {
        settings.remindOn = breaksBox.checked;
        saveSettings();
        applySettings('remindOn');
        fillSettings();
      });

      // A new sound choice applies at once: the sounds already scheduled are scheduled again with it.
      // One that is playing plays out.
      soundRadios.forEach((radio) => {
        radio.addEventListener('change', () => {
          settings.sounds = radio.value;
          saveSettings();
          const kind = runningKind();
          if (ctx && kind) rescheduleSounds(kind);
          fillSettings();
        });
      });

      // Each play button plays the sound of its moment, recorded or ding as chosen.
      page.querySelectorAll('[data-sound]').forEach((button) => {
        button.addEventListener('click', () => {
          if (!audio()) return;
          playNow(button.dataset.sound);
          suspendSoon();
        });
      });

      // ---------- Keep screen on (Screen Wake Lock API) ----------

      let wantAwake = false;
      let wakeLock = null;

      async function lockScreen() {
        try {
          const lock = await navigator.wakeLock.request('screen');
          if (!wantAwake) {  // switched off while the request was pending
            lock.release().catch(() => {});
            return;
          }
          wakeLock = lock;
          lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
          wakeNote.textContent = '';
        } catch (e) {
          wantAwake = false;
          wakeBtn.setAttribute('aria-pressed', 'false');
          wakeNote.textContent = 'This browser didn’t allow keeping the screen on.';
        }

      if ('wakeLock' in navigator) {
        wakeBtn.hidden = false;
        wakeBtn.addEventListener('click', () => {
          wantAwake = !wantAwake;

      // Browsers drop the screen lock while the page is hidden: take it again on return,
      // and bring the display up to date.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        if (wantAwake && !wakeLock) lockScreen();
        tick();
      });

      // ---------- Floating window (Document Picture-in-Picture API) ----------
      // The timer column moves into a small window that stays on top of other windows, and moves
      // back when that window closes. It keeps working there, because this script still runs it.

      async function openFloat() {
        floatBtn.disabled = true;

          floatWin = await documentPictureInPicture.requestWindow({ width: 240, height: 120 });
        } catch (e) {

          floatBtn.disabled = false;

        // so the page's scoped rules apply there too.
        const doc = floatWin.document;
        document.querySelectorAll('style').forEach((style) => doc.head.append(style.cloneNode(true)));
        doc.title = page.dataset.title;
        floatShell = doc.createElement('div');
        floatShell.id = page.id;
        floatShell.className = 'is-floating';
        floatShell.append(main);
        doc.body.append(floatShell);
        away.hidden = false;

        floatWin.addEventListener('pagehide', bringBack);
        render();  // gives the floating window the colors of the timer on show
        if (runningKind()) startTicking();

      // Runs when the floating window closes, however it was closed.
      function bringBack() {
        floatWin = null;
        floatShell = null;
        floatIntervalId = 0;  // the window's timers closed with it

        away.before(main);
        away.hidden = true;
        floatBtn.setAttribute('aria-pressed', 'false');
        if (hadFocus) floatBtn.focus();
